name: Build and release binaries

# Adapted from the fastsem release-rlib.yml pattern, but for wkbenchless'
# application binaries (wkbenchless + wkbctl) across Linux / macOS / Windows.
#
# NOTE on portability -- all three now build:
#   * Linux   -- uirelays X11 driver + POSIX PTY (openpt/fork).
#   * macOS   -- native Cocoa driver + POSIX PTY. No XQuartz needed.
#   * Windows -- winapi UI driver + a ConPTY terminal (CreatePseudoConsole).
#     The control socket is loopback TCP, so `wkbctl` / agent control work
#     here too; only the hot-reload fd-handoff is POSIX-only (C-c r rebuilds
#     and restarts without carrying sessions over).
# `fail-fast: false` still lets the other platforms publish if one regresses.
# ci.yml builds and tests all three on every push, so a regression shows up
# before a tag does.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. v0.1.1)'
        required: true

jobs:
  build:
    name: Build ${{ matrix.config.label }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45          # fail a hung build instead of blocking the release

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-22.04,   label: linux_x86_64,  exe: '',     nim: '2.4.0', shell: bash }  # GPU build needs >= 2.4
          - { os: macos-latest,   label: macos_arm64,   exe: '',     nim: '2.2.6', shell: bash }
          - { os: windows-latest, label: windows_x86_64, exe: '.exe', nim: '2.2.6', shell: 'msys2 {0}' }
          # NOTE: the macOS x86_64 leg (runs-on: macos-13, Intel) is dropped --
          # that runner never got scheduled and left every release job stuck in
          # `needs: build`, so no release ever published. macos-latest (Apple
          # Silicon / arm64) covers current Macs; Intel Mac users build from
          # source until a reliable Intel runner is available.

    # Windows: every `run:` goes through the MSYS2 MINGW64 shell, so Nim
    # compiles with the same gcc and pkg-config that built toxcore.
    defaults:
      run:
        shell: ${{ matrix.config.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── X11 / font dev libraries (Linux build & runtime deps) ──────────────
      - name: Install X11 dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxft-dev libxext-dev libxrender-dev \
            libfontconfig1-dev libfreetype6-dev

      # macOS needs no extra deps: uirelays uses the native Cocoa driver.

      # -- Tox tunnel: nim-tuntox + a static c-toxcore/libsodium ---------------
      # The binaries carry the in-process Tox tunnel (extensions/tox_collab.nim).
      # config.nims turns it on (-d:wkbTox) when it finds the nim-tuntox
      # checkout at $WKB_TUNTOX_DIR and toxcore through pkg-config.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf

      - name: Install pkg-config (macOS)
        if: runner.os == 'macOS'
        run: brew list pkgconf >/dev/null 2>&1 || brew install pkgconf

      - name: Fetch nim-tuntox
        uses: actions/checkout@v4
        with:
          repository: lf-araujo/nim-tuntox
          ref: 0079659e16b7d5f9bef858270c3dfc36cfa0143c  # lf-araujo/nim-tuntox master
          path: nim-tuntox

      - name: Cache toxcore
        id: toxcache
        uses: actions/cache@v4
        with:
          path: .toxcore
          key: toxcore-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-toxcore.sh') }}

      - name: Build toxcore (static)
        if: steps.toxcache.outputs.cache-hit != 'true'
        run: bash scripts/build-toxcore.sh .toxcore

      - name: Point the build at Tox
        run: |
          ws="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then ws="$(cygpath -m "$ws")"; fi
          echo "WKB_TUNTOX_DIR=$ws/nim-tuntox" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            # every MSYS2 login shell resets PKG_CONFIG_PATH; prepend after it
            echo "export PKG_CONFIG_PATH=\"$(cygpath -u "$ws")/.toxcore/lib/pkgconfig:\$PKG_CONFIG_PATH\"" \
              > /etc/profile.d/wkb-toxcore.sh
          else
            echo "PKG_CONFIG_PATH=$ws/.toxcore/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
          echo "WKB_REQUIRE_TOX=1" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$ws/.toxcore/lib/pkgconfig" pkg-config --static --libs toxcore

      # ── Install Nim ────────────────────────────────────────────────────────
      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.config.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Install Nimble dependencies (uirelays, etc.) ───────────────────────
      - name: Install Nimble packages
        run: nimble install -d -y

      # ── Build the single binary ────────────────────────────────────────────
      - name: Build wkbenchless
        run: |
          # One binary per platform: `wkbenchless ctl <verb>` (or a `wkbctl`
          # symlink) is the control client, so no separate wkbctl is shipped.
          # On Windows the editor is a GUI-subsystem app (no console window).
          GUI=""
          # Windows links static (toxcore's pthreads, libgcc): one .exe, no DLLs.
          if [ -n "${{ matrix.config.exe }}" ]; then GUI="--app:gui --passL:-static"; fi
          nim c -d:release -d:danger --opt:size $GUI \
            -o:wkbenchless${{ matrix.config.exe }} src/wkbenchless.nim

      # ── Name the binary by platform (shipped as-is, no archive) ────────────
      - name: Name the artifact
        run: |
          ASSET="wkbenchless_${{ matrix.config.label }}${{ matrix.config.exe }}"
          cp "wkbenchless${{ matrix.config.exe }}" "$ASSET"
          echo "ASSET=$ASSET" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.label }}
          path: ${{ env.ASSET }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    # Publish whatever built even if a platform leg fails/regresses -- don't let
    # one broken platform block the release. (Skips only if the run is cancelled.)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: wkbenchless ${{ steps.tag.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
