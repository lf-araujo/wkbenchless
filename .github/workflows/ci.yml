name: CI

# Build and test on Linux / macOS / Windows on every push and pull request, so
# a platform that stops building or passing is caught then -- not on release
# day (release.yml only runs on a version tag). Setup mirrors release.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.config.label }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-22.04,   label: linux_x86_64,   exe: '',     nim: '2.4.0', shell: bash }  # GPU build needs >= 2.4
          - { os: macos-latest,   label: macos_arm64,    exe: '',     nim: '2.2.6', shell: bash }
          - { os: windows-latest, label: windows_x86_64, exe: '.exe', nim: '2.2.6', shell: 'msys2 {0}' }

    # Windows: every `run:` goes through the MSYS2 MINGW64 shell, so Nim
    # compiles with the same gcc and pkg-config that built toxcore.
    defaults:
      run:
        shell: ${{ matrix.config.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install X11 dev libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxft-dev libxext-dev libxrender-dev \
            libfontconfig1-dev libfreetype6-dev

      # -- Tox tunnel: nim-tuntox + a static c-toxcore/libsodium ---------------
      # The binaries carry the in-process Tox tunnel (extensions/tox_collab.nim).
      # config.nims turns it on (-d:wkbTox) when it finds the nim-tuntox
      # checkout at $WKB_TUNTOX_DIR and toxcore through pkg-config.
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            make mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf

      - name: Install pkg-config (macOS)
        if: runner.os == 'macOS'
        run: brew list pkgconf >/dev/null 2>&1 || brew install pkgconf

      - name: Fetch nim-tuntox
        uses: actions/checkout@v4
        with:
          repository: lf-araujo/nim-tuntox
          ref: 0079659e16b7d5f9bef858270c3dfc36cfa0143c  # lf-araujo/nim-tuntox master
          path: nim-tuntox

      - name: Cache toxcore
        id: toxcache
        uses: actions/cache@v4
        with:
          path: .toxcore
          key: toxcore-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-toxcore.sh') }}

      - name: Build toxcore (static)
        if: steps.toxcache.outputs.cache-hit != 'true'
        run: bash scripts/build-toxcore.sh .toxcore

      - name: Point the build at Tox
        run: |
          ws="$GITHUB_WORKSPACE"
          if command -v cygpath >/dev/null 2>&1; then ws="$(cygpath -m "$ws")"; fi
          echo "WKB_TUNTOX_DIR=$ws/nim-tuntox" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            # every MSYS2 login shell resets PKG_CONFIG_PATH; prepend after it
            echo "export PKG_CONFIG_PATH=\"$(cygpath -u "$ws")/.toxcore/lib/pkgconfig:\$PKG_CONFIG_PATH\"" \
              > /etc/profile.d/wkb-toxcore.sh
          else
            echo "PKG_CONFIG_PATH=$ws/.toxcore/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
          echo "WKB_REQUIRE_TOX=1" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$ws/.toxcore/lib/pkgconfig" pkg-config --static --libs toxcore

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.config.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nimble packages
        run: nimble install -d -y

      # The same flags release.yml ships with (Windows: a GUI-subsystem app).
      - name: Build wkbenchless + wkbctl
        run: |
          set -e
          GUI=""
          # Windows links static (toxcore's pthreads, libgcc): one .exe, no DLLs.
          if [ -n "${{ matrix.config.exe }}" ]; then GUI="--app:gui --passL:-static"; fi
          nim c -d:release --hints:off $GUI \
            -o:wkbenchless${{ matrix.config.exe }} src/wkbenchless.nim
          nim c -d:release --hints:off \
            -o:wkbctl${{ matrix.config.exe }} src/wkbctl.nim

      # Unit tests. Each skips what needs a tool the runner lacks (R, pandoc,
      # bash). Windows runs the ones that need no POSIX shell; the session
      # tests drive bash REPLs over a PTY. Manual integration tools
      # (test_tmux_remote, test_highlight_perf) take arguments and are not here.
      - name: Run tests
        run: |
          tests="test_bib test_cite test_collab_diverge test_diff test_hist
                 test_landmark test_logoot test_otd_spans test_regex
                 test_rmd_fold test_search test_session_view test_supplement
                 test_tmuxctl test_tox_transport test_utf8_cursor"
          if [ "$RUNNER_OS" != "Windows" ]; then
            tests="$tests test_async_session test_blocks test_dag
                   test_ssh_reconnect"
          fi
          failed=""
          for t in $tests; do
            echo "::group::$t"
            if nim c -r --hints:off --warnings:off "src/$t.nim"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"; echo "::error::$t failed"; failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
